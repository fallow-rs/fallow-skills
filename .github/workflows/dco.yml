name: DCO

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: dco-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Every commit in a pull request needs a Signed-off-by line. Bot pull
      # requests do not carry a sign-off.
      - name: Check DCO sign-off
        if: github.event.pull_request.user.type != 'Bot'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/check-dco.mjs
